name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Flutter build configuration
        run: flutter build apk --config-only

      - name: Configure Android signing when secrets are available
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] && \
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && \
             [ -z "$ANDROID_KEY_PASSWORD" ] && \
             [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "No Android signing secrets configured; release artifacts will be unsigned."
            exit 0
          fi

          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || \
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "::error::Android signing is partially configured. Set all four Android signing secrets."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --no-pub

      - name: Build release app bundle
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --no-pub

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wara2a-android-release-${{ github.ref_name }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/upload-keystore.jks
