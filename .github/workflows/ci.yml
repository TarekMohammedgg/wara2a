name: Flutter CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Set up Android SDK 37
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Install ObjectBox native library
        run: bash <(curl -fsSL https://raw.githubusercontent.com/objectbox/objectbox-dart/main/install.sh)

      - name: Generate Flutter build configuration
        run: flutter build apk --config-only

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wara2a-debug-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run tests
        run: |
          flutter test --no-pub \
            test/core \
            test/features/invoice_capture \
            test/features/invoice_details \
            test/features/search/objectbox_search_repository_test.dart \
            test/features/search/search_cubit_test.dart \
            test/features/search/search_intent_router_test.dart \
            test/features/search/search_models_test.dart \
            test/features/settings
